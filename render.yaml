services:
  - type: web
    name: gharcraft-api-staging
    env: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Staging
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: gharcraft-db-staging
          property: connectionString
      - key: Jwt__Secret
        generateValue: true
      - key: Jwt__Issuer
        value: GharCraft.Api
      - key: Jwt__Audience
        value: GharCraft.Client

databases:
  - name: gharcraft-db-staging
    databaseName: gharcraft
    user: gharcraft_user
    plan: free
